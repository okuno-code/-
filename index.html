<!DOCTYPE html>
<html lang="ja" data-theme="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>かんたん家計簿</title>
<meta name="theme-color" content="#e3f0fd">
<meta name="description" content="収入と支出をシンプルに記録・確認できる家計簿アプリ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1 id="header-title">ホーム</h1>
  </header>

  <main id="view-root" class="view-root">

    <!-- ホーム画面: 年ごとの収支 -->
    <section id="view-home" class="view">
      <div class="year-switcher">
        <button id="year-prev" class="year-arrow" aria-label="前の年">‹</button>
        <div class="year-label" id="year-label">----年</div>
        <button id="year-next" class="year-arrow" aria-label="次の年">›</button>
      </div>

      <div class="summary-card">
        <div class="balance-block">
          <span class="balance-label">収支</span>
          <span class="balance-amount" id="home-balance">¥0</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-split">
          <div class="split-item">
            <span class="summary-icon income-icon">↑ 収入</span>
            <span class="summary-amount income-amount" id="home-income">¥0</span>
          </div>
          <div class="split-sep"></div>
          <div class="split-item">
            <span class="summary-icon expense-icon">↓ 支出</span>
            <span class="summary-amount expense-amount" id="home-expense">¥0</span>
          </div>
        </div>
      </div>

      <div class="month-list" id="month-list"></div>
    </section>

    <!-- 内訳画面: 収入・支出の一覧と取り消し -->
    <section id="view-breakdown" class="view hidden">
      <div class="month-switcher">
        <button id="month-prev" class="year-arrow" aria-label="前の月">‹</button>
        <div class="month-label" id="month-label">----年--月</div>
        <button id="month-next" class="year-arrow" aria-label="次の月">›</button>
      </div>

      <div class="filter-chips">
        <button class="chip active" data-filter="all">すべて</button>
        <button class="chip" data-filter="income">収入</button>
        <button class="chip" data-filter="expense">支出</button>
      </div>

      <div class="breakdown-summary" id="breakdown-summary"></div>

      <ul class="transaction-list" id="transaction-list"></ul>
      <p class="empty-message hidden" id="breakdown-empty">この期間の記録はまだありません</p>
    </section>

    <!-- 設定画面: 背景カラー変更 -->
    <section id="view-settings" class="view hidden">
      <h2 class="settings-title">画面のカラーを選ぶ</h2>
      <p class="settings-desc">お好みの色に画面全体の背景を変更できます</p>
      <div class="color-grid" id="color-grid"></div>
    </section>

  </main>

  <button id="fab-add" class="fab" aria-label="収支を追加">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <span class="nav-icon">🏠</span><span class="nav-text">ホーム</span>
    </button>
    <button class="nav-btn" data-view="breakdown">
      <span class="nav-icon">📋</span><span class="nav-text">内訳</span>
    </button>
    <button class="nav-btn" data-view="settings">
      <span class="nav-icon">⚙️</span><span class="nav-text">設定</span>
    </button>
  </nav>
</div>

<!-- 追加モーダル -->
<div id="modal-add" class="modal-overlay hidden">
  <div class="modal">
    <h2 class="modal-title">記録を追加</h2>

    <div class="type-toggle">
      <button type="button" class="type-btn expense-type active" data-type="expense">支出</button>
      <button type="button" class="type-btn income-type" data-type="income">収入</button>
    </div>

    <form id="add-form">
      <label class="field-label" for="input-amount">金額</label>
      <div class="amount-field">
        <span class="yen-sign">¥</span>
        <input type="number" id="input-amount" inputmode="numeric" min="1" step="1" placeholder="0" required>
      </div>

      <label class="field-label" for="input-category">カテゴリ</label>
      <select id="input-category"></select>

      <label class="field-label" for="input-date">日付</label>
      <input type="date" id="input-date" required>

      <label class="field-label" for="input-memo">メモ（任意）</label>
      <input type="text" id="input-memo" placeholder="例）スーパーで買い物">

      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn-secondary">キャンセル</button>
        <button type="submit" class="btn-primary">保存する</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
